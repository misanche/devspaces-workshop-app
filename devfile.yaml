schemaVersion: 2.3.0
metadata:
  name: nodejs-workshop-app
  displayName: DevSpaces Champions Workshop Node.js App
  description: Sample Node.js Express application for OpenShift DevSpaces hands-on workshop
components:
  - name: outer-loop-build
    container:
      image: registry.access.redhat.com/ubi9/nodejs-24:latest
      # memoryLimit: 1024Mi
      mountSources: true
      command: ['tail']
      args: ['-f', '/dev/null']
      endpoints:
        - name: http-8080
          targetPort: 8080
          exposure: public
          protocol: http
          secure: true
        - name: debug-9229
          targetPort: 9229
          exposure: internal
      env:
        - name: DB_HOST
          value: "localhost"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "workshop_user"
        - name: DB_PASSWORD
          value: "workshop_pass"
        - name: DB_NAME
          value: "workshop_db"
  - name: postgres-db
    container:
      image: quay.io/sclorg/postgresql-13-c9s:latest
      memoryLimit: 512Mi
      env:
        - name: POSTGRESQL_USER
          value: "workshop_user"
        - name: POSTGRESQL_PASSWORD
          value: "workshop_pass"
        - name: POSTGRESQL_DATABASE
          value: "workshop_db"
      endpoints:
        - name: postgres
          targetPort: 5432
          exposure: internal

commands:
  - id: run-app
    exec:
      component: outer-loop-build
      commandLine: "npm run start"
      workingDir: ${PROJECT_SOURCE}
      group:
        kind: run
        isDefault: true
  - id: run-tests
    exec:
      component: outer-loop-build
      commandLine: "npm test"
      workingDir: ${PROJECT_SOURCE}
      group:
        kind: test
        isDefault: true
  - id: run-install
    exec:
      component: outer-loop-build
      commandLine: "npm install"
      workingDir: ${PROJECT_SOURCE}
      group:
        kind: build
        isDefault: true
events:
  postStart:
    - run-install